version: '3.8'
services:
  mongo:
    image: mongo:latest
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: pass
    healthcheck:
      test: "exit 0" # Alternatively, use an actual health check script to verify MongoDB is ready
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

  mongo-express:
    image: mongo-express:latest
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: pass
      ME_CONFIG_MONGODB_SERVER: mongo
    command: ["sh", "-c", "sleep 60 && /docker-entrypoint.sh mongo-express"]
